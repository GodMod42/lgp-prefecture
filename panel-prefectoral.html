<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Préfecture de LGP — Panel préfectoral</title>
<style>
:root{--bleu:#000091;--lav:#e8e8fb;--fond:#f5f5f8;--carte:#fff;--texte:#161616;--gris:#666;--ligne:#ddd;--ok:#18753c;--warn:#b34000;--err:#ce0500;--sans:Marianne,"Public Sans","Segoe UI",system-ui,sans-serif}
:root[data-theme=dark]{--bleu:#8b8bff;--lav:#26264f;--fond:#161616;--carte:#1e1e1e;--texte:#f0f0f0;--gris:#b5b5b5;--ligne:#3a3a3a;--ok:#27a658;--warn:#fc5d00;--err:#ff6b6b}
*{box-sizing:border-box;margin:0}
body{font-family:var(--sans);background:var(--fond);color:var(--texte);line-height:1.5}
.top{background:var(--carte);border-top:6px solid;border-image:linear-gradient(90deg,#000091 33.3%,#fff 33.3% 66.6%,#e1000f 66.6%) 1;box-shadow:0 1px 0 var(--ligne);position:sticky;top:0;z-index:10}
.top .in{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 24px}
.top h1{font-size:1.15rem;margin-right:auto}
.b{padding:9px 18px;border-radius:999px;border:1px solid var(--ligne);background:var(--carte);color:var(--texte);font:600 .88rem var(--sans);cursor:pointer;text-decoration:none;display:inline-block}
.b:hover{background:var(--lav)}.b.p{background:#000091;color:#fff;border-color:#000091}
:root[data-theme=dark] .b.p{background:#8b8bff;color:#000}
.b.danger{color:var(--err);border-color:currentColor}.b.sm{padding:4px 12px;font-size:.78rem}
.note{background:var(--lav);font-size:.85rem;padding:8px 24px}
.lay{display:grid;grid-template-columns:250px 1fr;gap:24px;max-width:1300px;margin:0 auto;padding:24px}
aside{position:sticky;top:120px;align-self:start;display:flex;flex-direction:column;gap:12px;max-height:calc(100vh - 140px);overflow:auto}
.nav-group{display:flex;flex-direction:column;gap:2px}.nav-group-title{font-size:.68rem;text-transform:uppercase;letter-spacing:.09em;color:var(--gris);font-weight:800;padding:6px 12px 3px}
.nv{all:unset;box-sizing:border-box;display:flex;gap:10px;padding:10px 14px;border-radius:8px;cursor:pointer;font-weight:600;font-size:.92rem}
.nv:hover{background:var(--lav)}.nv.on{background:var(--bleu);color:#fff}:root[data-theme=dark] .nv.on{color:#000}
.nv:focus-visible,.b:focus-visible{outline:3px solid #0a76f6}
main{background:var(--carte);border:1px solid var(--ligne);border-radius:10px;padding:26px;min-width:0}
input[type=text],input[type=search],input[type=date],input[type=datetime-local],select,textarea{width:100%;padding:9px 12px;border:1px solid var(--ligne);border-radius:6px;background:var(--carte);color:var(--texte);font:inherit;font-size:.92rem}
textarea{resize:vertical;min-height:90px}input[type=search]{margin:16px 0 8px}
.hero{display:flex;gap:16px;align-items:center;padding:18px 20px;border-radius:14px;margin-bottom:18px;background:linear-gradient(120deg,var(--lav),var(--carte));border:1px solid var(--ligne)}
.hero .ic{font-size:1.7rem;width:56px;height:56px;border-radius:14px;background:var(--carte);display:grid;place-items:center;box-shadow:0 2px 8px #0002;flex:none}
.hero h2{font-size:1.4rem}.hero p{color:var(--gris);font-size:.9rem}.hero .cnt{margin-left:auto;font-weight:800;font-size:.8rem;background:var(--bleu);color:#fff;border-radius:99px;padding:3px 12px;white-space:nowrap}
:root[data-theme=dark] .hero .cnt{color:#000}
.finance-company{border:1px solid var(--ligne);border-radius:10px;overflow:hidden}.finance-company>summary{padding:13px 18px;cursor:pointer;list-style:none;font-weight:700;color:var(--bleu)}.finance-company>summary::-webkit-details-marker{display:none}.finance-company[open]>summary{border-bottom:1px solid var(--ligne);background:var(--fond)}
.finance-form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;padding:18px}.finance-field{min-width:0}.finance-field.full{grid-column:1/-1}.finance-field label{display:block;font-size:.82rem;font-weight:700;margin-bottom:5px}
.av{--s:36px;width:var(--s);height:var(--s);border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:calc(var(--s)*.38);flex:none}
.line{display:flex;flex-wrap:wrap;gap:4px 16px;color:var(--gris);font-size:.88rem;margin:3px 0 6px}
.dt{white-space:pre-wrap;font-size:.88rem;color:var(--gris)}
.foot{display:flex;align-items:center;gap:8px;margin-top:12px;color:var(--gris);font-size:.78rem}.foot .b{margin-left:auto}
.tag{--c:var(--bleu);display:inline-block;font-size:.72rem;font-weight:800;padding:3px 10px;border-radius:99px;background:var(--c);color:#fff}
:root[data-theme=dark] .tag{color:#000}
.sec,.dayh{font-size:.8rem;font-weight:800;letter-spacing:.06em;color:var(--gris);margin:22px 0 10px;text-transform:uppercase}.dayh{font-size:.95rem;text-transform:capitalize;letter-spacing:0;color:var(--texte)}
.chip{width:auto;display:inline-block;border-radius:99px;padding:4px 12px;font-weight:700;font-size:.78rem;border:1px solid currentColor;background:color-mix(in srgb,currentColor 10%,var(--carte))}
.c-ok{color:var(--ok)}.c-warn{color:var(--warn)}.c-err{color:var(--err)}.c-mute{color:var(--gris)}.c-bl{color:var(--bleu)}
/* annonces */
.ann{--c:var(--bleu);border:1px solid var(--ligne);border-left:6px solid var(--c);border-radius:12px;padding:20px 22px;margin-bottom:16px}
.ann.warn{--c:var(--warn)}.ann.err{--c:var(--err)}.ann.first{background:color-mix(in srgb,var(--c) 7%,var(--carte))}
.ann .tag{background:var(--c)}.ann h3{font-size:1.25rem;margin:10px 0 6px}.ann p{white-space:pre-wrap}
/* réunions */
.reu{display:flex;gap:18px;border:1px solid var(--ligne);border-radius:12px;padding:16px;margin-bottom:14px}.reu.past{opacity:.6}
.cal{flex:none;width:68px;border-radius:10px;overflow:hidden;text-align:center;border:1px solid var(--ligne);align-self:flex-start}
.cal i{display:block;font-style:normal;background:var(--bleu);color:#fff;font-size:.7rem;font-weight:800;padding:3px 0;text-transform:uppercase}
:root[data-theme=dark] .cal i{color:#000}
.cal b{display:block;font-size:1.7rem;line-height:1.2;padding-top:4px}.cal span{display:block;font-size:.72rem;color:var(--gris);padding-bottom:6px}
.reu h3{font-size:1.1rem}.odj{margin:4px 0 0 18px;font-size:.9rem}
/* rendez-vous */
.rdv{display:grid;grid-template-columns:60px 1fr;gap:14px;margin-bottom:10px}.rdv.past{opacity:.55}
.rdv .t{font-weight:800;text-align:right;padding-top:14px}
.rdv .c{border:1px solid var(--ligne);border-left:4px solid var(--bleu);border-radius:10px;padding:10px 14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}.x{flex:1;min-width:150px}
/* dossiers */
.dos{display:grid;grid-template-columns:100px 1fr auto auto;gap:14px;align-items:center;border:1px solid var(--ligne);border-radius:10px;padding:12px 14px;margin-bottom:10px}
.ref{font-family:ui-monospace,Consolas,monospace;font-weight:700;color:var(--bleu);font-size:.85rem}
.bar{height:8px;border-radius:99px;background:var(--fond);overflow:hidden;margin-top:6px}.bar i{display:block;height:100%}
/* tuiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.tile{border:1px solid var(--ligne);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.ft{width:44px;height:52px;border-radius:6px 14px 6px 6px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:.8rem}
.sticky{--t:#fff3a8;--r:0deg;background:var(--t);border:0;box-shadow:2px 4px 10px #0003;transform:rotate(var(--r));color:#161616}.sticky .foot{color:#444}.sticky p{white-space:pre-wrap}
.look img,.look .ph{width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:8px;background:var(--fond);display:grid;place-items:center;font-size:2.4rem}
.ctc{align-items:center;text-align:center}.ctc .line{margin:0;justify-content:center}
.abs{display:flex;gap:14px;align-items:center;border:1px solid var(--ligne);border-radius:12px;padding:12px 14px;margin-bottom:10px}.abs .x{flex:1}
.vide{text-align:center;color:var(--gris);padding:40px 10px}.vide b{display:block;font-size:2rem}
/* chat */
.chat{display:grid;grid-template-columns:170px 1fr;border:1px solid var(--ligne);border-radius:12px;overflow:hidden;height:min(640px,calc(100vh - 280px));min-height:440px}
.rooms{background:var(--fond);border-right:1px solid var(--ligne);padding:10px;display:flex;flex-direction:column;gap:2px}
.room{all:unset;box-sizing:border-box;padding:9px 12px;border-radius:8px;cursor:pointer;font-weight:600;font-size:.9rem}.room:hover{background:var(--lav)}.room.on{background:var(--bleu);color:#fff}
:root[data-theme=dark] .room.on{color:#000}
.conv{display:flex;flex-direction:column;min-width:0}.ch{padding:12px 16px;border-bottom:1px solid var(--ligne);font-weight:800}.ch small{font-weight:400;color:var(--gris);margin-left:8px}
.msgs{flex:1;overflow:auto;padding:14px 16px;display:flex;flex-direction:column;gap:3px}
.day{align-self:center;font-size:.72rem;font-weight:700;color:var(--gris);background:var(--fond);border-radius:99px;padding:2px 12px;margin:12px 0 6px}
.m{display:flex;gap:10px;align-items:flex-end;max-width:80%}.m.me{align-self:flex-end;flex-direction:row-reverse}.m .av{--s:32px;visibility:hidden}.m.first .av{visibility:visible}.m.first{margin-top:8px}
.who{font-size:.74rem;font-weight:700;color:var(--gris);margin:0 0 2px 4px}
.bub{padding:8px 13px;border-radius:16px 16px 16px 4px;background:var(--lav);overflow-wrap:anywhere;white-space:pre-wrap;position:relative}
.me .bub{background:var(--bleu);color:#fff;border-radius:16px 16px 4px 16px}:root[data-theme=dark] .me .bub{color:#000}
.m time{font-size:.66rem;color:var(--gris);padding-bottom:3px}
.m .x2{all:unset;cursor:pointer;opacity:0;font-size:.8rem;color:var(--err);padding:0 4px}.m:hover .x2{opacity:1}
.comp{display:flex;gap:10px;padding:12px;border-top:1px solid var(--ligne);align-items:flex-end}.comp textarea{min-height:44px;height:44px;border-radius:22px;padding:11px 16px}
@media(max-width:700px){.finance-form{grid-template-columns:1fr}.finance-field.full{grid-column:auto}.dos{grid-template-columns:1fr}.chat{grid-template-columns:1fr;height:70vh}.rooms{flex-direction:row;overflow:auto;border-right:0;border-bottom:1px solid var(--ligne)}.reu{flex-direction:column}}
@media(max-width:800px){.lay{grid-template-columns:1fr}aside{position:static;max-height:none;overflow:visible;display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));align-items:start}}
.ico{display:inline-flex;vertical-align:-3px;flex:none}.it{display:inline-flex;align-items:center;gap:5px}
.nv{align-items:center}.hero .ic{color:var(--bleu)}.vide .ico{display:flex;justify-content:center;margin-bottom:8px}.look .ph{color:var(--gris)}
img.av{object-fit:cover;background:var(--fond)}.me-chip{display:flex;align-items:center;gap:8px;font-weight:600;font-size:.85rem}
.svc-card{display:flex;gap:18px;align-items:center;flex-wrap:wrap;border:1px solid var(--ligne);border-left:6px solid var(--gris);border-radius:14px;padding:20px 22px;margin-bottom:18px}
.svc-card.on{border-left-color:var(--ok);background:color-mix(in srgb,var(--ok) 7%,var(--carte))}.svc-card .x{flex:1;min-width:200px}.svc-card h3{font-size:1.2rem}
.pulse{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--ok);margin-right:8px;animation:pl 1.8s infinite}
@keyframes pl{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--ok) 55%,transparent)}70%{box-shadow:0 0 0 9px transparent}100%{box-shadow:0 0 0 0 transparent}}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:8px}
.kpi{border:1px solid var(--ligne);border-radius:12px;padding:14px 16px}.kpi b{display:block;font-size:1.5rem;line-height:1.2}.kpi span{font-size:.74rem;color:var(--gris);text-transform:uppercase;letter-spacing:.05em;font-weight:700}
.agent{display:flex;align-items:center;gap:12px;border:1px solid var(--ligne);border-radius:12px;padding:10px 14px;margin-bottom:8px}.agent .x{flex:1;min-width:0}
.clk{font-variant-numeric:tabular-nums;font-weight:800;color:var(--ok)}
.hist{display:flex;gap:14px;align-items:center;padding:9px 4px;border-bottom:1px solid var(--ligne);font-size:.9rem}
.btn-big{padding:12px 26px;font-size:1rem}
.relay{display:flex;gap:12px;align-items:flex-start;background:var(--lav);border-left:4px solid var(--bleu);border-radius:8px;padding:12px 16px;margin-bottom:16px;font-size:.9rem;color:var(--bleu)}
.relay b{display:block}.relay span{color:var(--texte)}
.dchip{display:inline-flex;align-items:center;gap:6px;font-size:.74rem;font-weight:700;color:var(--bleu);border:1px solid var(--bleu);border-radius:99px;padding:3px 10px;white-space:nowrap}
.toast{position:fixed;right:20px;bottom:24px;max-width:360px;background:var(--texte);color:var(--carte);padding:12px 18px;border-radius:10px;font-size:.9rem;box-shadow:0 8px 24px #0004;z-index:60;opacity:0;transform:translateY(8px);transition:.25s;pointer-events:none}.toast.on{opacity:1;transform:none}
</style>

/* ===== Stockage : API du site, ou navigateur si l'API n'existe pas encore ===== */
const store=(()=>{
  let off=false;
  const lk=m=>"lgp_pref_"+m,lr=m=>{try{return JSON.parse(localStorage.getItem(lk(m))||"[]")}catch(e){return[]}},lw=(m,v)=>{try{localStorage.setItem(lk(m),JSON.stringify(v))}catch(e){}};
  const api=async(method,m,body)=>{
    const r=await fetch("/api/prefecture?module="+m,{method,headers:{Authorization:"Bearer "+u.token,"Content-Type":"application/json"},body:body?JSON.stringify(body):undefined});
    const d=await r.json().catch(()=>({}));if(!r.ok){const e=new Error(d.error||r.status);e.status=r.status;throw e}return d};
  const run=async(method,m,body,local)=>{
    if(!off){try{return await api(method,m,body)}catch(e){
      if(e.status===401||e.status===403)throw e;
      off=true;const why=String(e.status||e.message||"aucune réponse")+(e.status&&e.message&&e.message!==String(e.status)?" – "+e.message:"");$("#st").innerHTML="<b>Mode local</b> : l'API /api/prefecture a répondu « "+why.replace(/[<>&]/g,"")+" ». Les données restent dans ce navigateur et ne sont pas partagées entre agents."}}
    return local()};
  const me=()=>myName();
  return{
    list:m=>run("GET",m,null,()=>lr(m)),
    add:(m,it)=>run("POST",m,it,()=>{const v=lr(m);v.unshift({...it,id:Date.now().toString(36)+Math.random().toString(36).slice(2,5),author:me(),author_id:myId(),avatar:myAvatar(),created_at:new Date().toISOString()});lw(m,v)}),
    patch:(m,id,ch)=>run("PATCH",m,{id,...ch},()=>{const v=lr(m),i=v.findIndex(x=>x.id===id);if(i>-1)Object.assign(v[i],ch);lw(m,v)}),
    del:(m,id)=>run("DELETE",m,{id},()=>lw(m,lr(m).filter(x=>x.id!==id))),
    svc:(method,body)=>api(method,"service",body),
    me};
})();

    const load=async()=>{try{items=await store.list(mod);render()}catch(e){box.textContent=e.status===403?"Ton compte n'a pas le rôle Préfectoral.":"Impossible de charger les données. Réessaie dans un instant."}};
    q.oninput=render;
    form.onsubmit=async e=>{e.preventDefault();save.disabled=true;
      try{const data={};Object.keys(inputs).forEach(k=>data[k]=inputs[k].value);const r=await store.add(mod,data);form.reset();add.open=false;await load();toast(!RELAY[mod]?"Enregistré.":r&&r._discord===true?"Enregistré et envoyé sur Discord.":r&&r._discord===false?"Enregistré, mais l'envoi sur Discord a échoué.":r&&r._discord===null?"Enregistré. Le webhook Discord de ce module n'est pas encore configuré.":"Enregistré.")}
      catch(err){alert("Impossible d'enregistrer : "+err.message)}finally{save.disabled=false}};
    await load()};

  $("#rf").onclick=draw;
  nav();draw();
}
</script>
