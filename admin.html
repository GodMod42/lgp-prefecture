    $("#st").innerHTML="Brouillon enregistrÃ© Ã  "+new Date().toLocaleTimeString("fr-FR")+" â€” <b>pas encore publiÃ©</b> : tÃ©lÃ©charge content.json et remplace celui de ton site."};
  const nav=()=>{const n=$("#nav");n.textContent="";
